[app]
cors_origins = ["http://localhost:5173", "http://localhost:8000"]
site_url = "http://localhost:5173"
log_level = "INFO"   # DEBUG | INFO | WARNING | ERROR

[database]
url = "postgresql://postgres:postgres@localhost:5432/human_rating_platform"

[exports]
stream_batch_size = 1000
stream_chunk_max_bytes = 4194304

[testing]
export_seed_row_count = 1500

[seeding]
enabled = false
experiment_name = "Seed - Local Baseline"
question_count = 50
num_ratings_per_question = 3
prolific_completion_url = ""

[prolific]
mode = "disabled"
api_token = ""
base_url = "https://api.prolific.com/api/v1"

[prefetch]
# One worker is reserved for foreground demand. Limits are per API process.
worker_count = 8
# Enable every current/future experiment, or use the allowlist for a pilot.
# To disable all new enrollment/speculation: enable_all=false AND experiment_ids=[].
enable_all = false
# Set lookahead_questions = 0 for queue-only comparison without speculation.
experiment_ids = []
lookahead_questions = 1

[pilot_check]
# docs/pilot-check.md. A hash of this section is stored on each run.
sample_size = 15
judge_model = "openrouter/anthropic/claude-sonnet-4-6"
# "warn" asks the admin to confirm before a study is created past a missing,
# stale or flagged check; "off" ignores the check. It never refuses a launch.
gate_mode = "warn"
# Start a run when an upload or an edit leaves the experiment ready to launch
# (skipped while one is in progress or the latest run is still fresh).
auto_start = true
# "inline" runs checks in the API process; "worker" queues them for
# `python -m pilot_check_worker` (production). Set on both services.
runner = "inline"
# Runs the worker takes on at once; the rest queue.
worker_concurrency = 1
# Frontend origin the screenshot check opens in a headless browser; empty
# skips it. Set per deployment (PILOT_CHECK__RATER_APP_URL).
rater_app_url = ""
# Per-check severity overrides, e.g. markdown_mode = "info".
[pilot_check.severities]
