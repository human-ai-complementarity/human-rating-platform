[app]
cors_origins = ["http://localhost:5173", "http://localhost:8000"]
site_url = "http://localhost:5173"
log_level = "INFO"   # DEBUG | INFO | WARNING | ERROR

[database]
url = "postgresql://postgres:postgres@localhost:5432/human_rating_platform"

[exports]
stream_batch_size = 1000
stream_chunk_max_bytes = 4194304

[testing]
export_seed_row_count = 1500

[seeding]
enabled = false
experiment_name = "Seed - Local Baseline"
question_count = 50
num_ratings_per_question = 3
prolific_completion_url = ""

[prolific]
mode = "disabled"
api_token = ""
base_url = "https://api.prolific.com/api/v1"

[prefetch]
# One worker is reserved for foreground demand. Limits are per API process.
worker_count = 8
# Enable every current/future experiment, or use the allowlist for a pilot.
# To disable all new enrollment/speculation: enable_all=false AND experiment_ids=[].
enable_all = false
# Set lookahead_questions = 0 for queue-only comparison without speculation.
experiment_ids = []
lookahead_questions = 1

[pilot_check]
# docs/pilot-check.md. A hash of this section is stored on each run.
sample_size = 15
judge_model = "openrouter/anthropic/claude-sonnet-4-6"
max_median_latency_seconds = 20
# "warn" asks for acknowledgement before a study is created past a missing,
# stale or flagged check; "block" refuses outright; "off" ignores the check.
gate_mode = "warn"
# Per-check severity overrides, e.g. markdown_mode = "info".
[pilot_check.severities]
