# Pilot check: what runs when an admin presses "Run check" on the Launch tab.
# See docs/pilot-check.md. Loaded once at startup; the file's hash is stored
# on every run, so editing it marks earlier runs stale.
#
# Every check in services/pilot_check/checks must be listed, and only those:
# an unknown or missing name fails startup rather than silently skipping.
# severity is "error", "warning" or "info". A run's status is the worst
# severity among its findings: "failed" on any error, "warnings" otherwise.

[sample]
# Served questions drawn per run (parent rows are header-only and skipped).
size = 15
# Set an integer for a repeatable draw while iterating on prompts.
# seed = 42

[judge]
# <provider>/<model-id>, the same spelling as assistance_models entries.
model = "openrouter/anthropic/claude-sonnet-4-6"
temperature = 0.0

[assistance]
# Budget for one method start() call, mirroring the preparation runner.
per_question_timeout_seconds = 120
# assistance_health: share of sampled starts allowed to come back with no
# assistance (none/skip) before the run fails. 0 means any failure is a finding.
max_failure_share = 0.0
# assistance_health: median start() latency above this is a warning.
max_median_latency_seconds = 20

[rendering]
# question_renders: question text longer than this is a warning, since the
# rater has to scroll inside the card.
max_question_chars = 20000

[gate]
# "warn":  creating a study asks for acknowledgement when the latest run is
#          missing, stale, running, or has findings at or above `severity`.
# "block": creating a study refuses in those cases, with no acknowledgement path.
# "off":   creating a study ignores the check (the UI still shows it).
mode = "warn"
severity = "warning"

[checks.consent_configured]
enabled = true
severity = "error"

[checks.launch_blockers]
enabled = true
severity = "error"

[checks.markdown_mode]
enabled = true
severity = "warning"

[checks.question_renders]
enabled = true
severity = "error"

[checks.assistance_output]
enabled = true
severity = "error"

[checks.assistance_health]
enabled = true
severity = "error"

[checks.instructions_coherent]
enabled = true
severity = "warning"

[checks.question_coherent]
enabled = true
severity = "warning"

[checks.assistance_useful]
enabled = true
severity = "warning"
