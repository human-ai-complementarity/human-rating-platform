name: ✅ CI Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Ruff check
        run: uvx ruff==0.15.2 check backend

      - name: Ruff format check
        run: uvx ruff==0.15.2 format --check backend

  lint-frontend:
    name: Lint Frontend (eslint + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: ESLint
        run: npm --prefix frontend run lint

      - name: Typecheck
        run: npm --prefix frontend run typecheck

  lint-yaml:
    name: Lint YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Yamllint
        run: uvx yamllint==1.38.0 .

  test-backend:
    name: Backend Tests (docker compose)
    runs-on: ubuntu-latest
    env:
      ADMIN_AUTH_ENABLED: "false"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run backend tests
        id: backend
        continue-on-error: true
        env:
          NO_COLOR: "1"
          KEEP_TEST_STACK: "1"
        run: |
          mkdir -p artifacts
          set -o pipefail
          make test 2>&1 | tee artifacts/backend-output.txt

      - name: Capture docker compose logs on failure
        if: steps.backend.outcome == 'failure'
        run: |
          docker compose -f docker-compose.test.yml -p human-rating-platform-test ps -a > artifacts/compose-ps.txt || true
          docker compose -f docker-compose.test.yml -p human-rating-platform-test logs --no-color db migrate test > artifacts/compose-logs.txt || true

      - name: Upload backend artifacts on failure
        if: steps.backend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-artifacts
          path: artifacts/

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml -p human-rating-platform-test down --remove-orphans || true

      - name: Fail if backend tests failed
        if: steps.backend.outcome == 'failure'
        run: exit 1

  test-frontend:
    name: Frontend Tests (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: error
