services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: human_rating_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d human_rating_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/astral-sh/uv:0.9.28-python3.11-bookworm-slim
    working_dir: /app/backend
    env_file:
      - backend/.env
    environment:
      APP_SECRET_KEY: "${APP_SECRET_KEY:-test-secret}"
      DATABASE__URL: postgresql://postgres:postgres@db:5432/human_rating_platform
      PYTHONPATH: /app/backend
      UV_PROJECT_ENVIRONMENT: /uv-env
    volumes:
      - ./:/app
      - uv_project_env:/uv-env
    command: >
      sh -c "uv sync --frozen --no-dev --no-install-project &&
             sh scripts/migrate.sh upgrade head"
    depends_on:
      db:
        condition: service_healthy

  test:
    image: ghcr.io/astral-sh/uv:0.9.28-python3.11-bookworm-slim
    working_dir: /app/backend
    env_file:
      - backend/.env
    environment:
      APP_SECRET_KEY: "${APP_SECRET_KEY:-test-secret}"
      DATABASE__URL: postgresql://postgres:postgres@db:5432/human_rating_platform
      PYTHONPATH: /app/backend
      UV_PROJECT_ENVIRONMENT: /uv-env
      ADMIN_AUTH_ENABLED: "${ADMIN_AUTH_ENABLED:-false}"
    volumes:
      - ./:/app
      - uv_project_env:/uv-env
    command: >
      sh -c "uv sync --frozen --no-install-project &&
             uv run --no-sync pytest -q tests/"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
  uv_project_env:
